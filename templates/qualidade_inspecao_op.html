<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inspeção da OP</title>
  <link rel="stylesheet" href="/style/estoque.css">
  <link rel="stylesheet" href="/style/qualidade_inspecoes.css">
</head>
<body class="login-page qualidade-page" data-page="qualidade-op" data-op="{{ op }}">

  <img src="/imagens/logo_agl.png" alt="Logo AGL" class="logo">

  <main class="login-shell qualidade-shell">
    <header class="login-header qualidade-header">
      <a href="/qualidade/inspecoes" class="primary-button qualidade-header__back">Início</a>
    </header>


    <section class="login-card qualidade-hero">
      <div class="qualidade-hero__content">
        <div>
          <h1 id="opTitulo">Inspeção da OP {{ op }}</h1>
        </div>
        <div class="quality-chip" id="opLinhaChip">Carregando linha</div>
      </div>

      <div class="quality-stats quality-stats--op">
        <article class="quality-stat quality-stat--highlight">
          <span>OP</span>
          <strong id="opDestaque">-</strong>
        </article>
        <article class="quality-stat quality-stat--highlight">
          <span>Código</span>
          <strong id="codigoDestaque">-</strong>
        </article>
        <article class="quality-stat quality-stat--highlight">
          <span>Quantidade</span>
          <strong id="quantidadeDestaque">-</strong>
        </article>

        <article class="quality-stat quality-stat--highlight">
          <span>Descrição</span>
          <strong id="fDescricaoVisual"></strong>
        </article>
      </div>

      <p id="statusMessage" class="login-status qualidade-status" role="status"></p>
    </section>
    <p></p>
    <section class="login-card qualidade-panel">
      <form id="inspecaoForm" class="quality-form">
        <input type="hidden" id="fOp" name="op">
        <input type="hidden" id="fCodigo" name="codigo">
        <input type="hidden" id="fDescricao" name="descricao">
        <input type="hidden" id="fQuantidade" name="quantidade">
        <input type="hidden" id="fInicio" name="data_hora_inicio_inspecao">
        <input type="hidden" id="fFim" name="data_hora_fim_inspecao">

        <section class="quality-form__group quality-form__group--controls">
          <div class="quality-field">
            <label>Status</label>
            <select id="fStatus" class="tipo">
              <option value="Em análise" selected>Iniciado</option>
              <option value="Conforme">Conforme</option>
              <option value="Não conforme">Não conforme</option>
            </select>
          </div>

          <div class="quality-field">
            <label>Resultado</label>
            <select id="fResultado" class="tipo">
              <option value="true" selected>Aprovado</option>
              <option value="false">Reprovado</option>
            </select>
          </div>

          <div class="quality-field quality-field--switch">
            <label class="quality-switch">
              <input id="fConformidade" type="checkbox" checked>
              <span>Tem etiqueta?</span>
            </label>
          </div>

          <div class="quality-field quality-field--switch">
            <label class="quality-switch">
              <input id="fRefugo" type="checkbox">
              <span>Houve refugo</span>
            </label>
          </div>

          <div class="quality-field quality-field--full">
            <label>Observações</label>
            <textarea id="fObservacao" rows="4" placeholder="Registre observações da inspeção"></textarea>
          </div>
        </section>

        <section class="quality-form__group">
          <div class="quality-panel__header">
            <div>
              <p class="eyebrow">ITENS INSPECIONADOS</p>
              <h2>Selecione os itens</h2>
            </div>
            <span class="quality-chip quality-chip--muted" id="itensSelecionadosCount">0 selecionados</span>
          </div>
          <p class="quality-empty quality-empty--compact">
            Clique no item para abrir o modal de refugo. O cartão mostra apenas a descrição e a seleção.
          </p>
          <div id="itensInspecionados" class="quality-stack"></div>
        </section>

        <div class="quality-form__footer">
          <button type="submit" class="primary-button" id="btnSalvarInspecao">
            Salvar e avançar
          </button>
          <a href="/qualidade/inspecoes" class="secondary-button quality-form__cancel">
            Cancelar
          </a>
        </div>
      </form>
    </section>
  </main>

  <div id="itemRefugoModal" class="quality-modal hidden" aria-hidden="true">
    <div class="quality-modal__backdrop" data-close-item-modal></div>
    <section class="quality-modal__panel quality-item-modal" role="dialog" aria-modal="true" aria-labelledby="itemRefugoTitle">
      <header class="quality-modal__header">
        <div>
          <p class="eyebrow">REFUGO DO ITEM</p>
          <h2 id="itemRefugoTitle">Item</h2>
        </div>
        <button type="button" class="quality-modal__close" data-close-item-modal>&times;</button>
      </header>

      <div class="quality-item-modal__meta">
        <strong id="itemRefugoDescricao">-</strong>
        <span id="itemRefugoLinha">Linha -</span>
      </div>

      <div class="quality-form__group quality-item-modal__form">
        <div class="quality-field">
          <label>Quantidade refugada</label>
          <input id="itemRefugoQuantidade" type="number" min="0" step="1" value="0">
        </div>
        <div class="quality-field">
          <label>Código da não conformidade</label>
          <input id="itemRefugoCodigoNc" type="text" placeholder="Informe o código">
        </div>
        <div class="quality-field quality-field--full">
          <label>Observação</label>
          <textarea id="itemRefugoObservacao" rows="4" placeholder="Se quiser, detalhe a ocorrência"></textarea>
        </div>
      </div>

      <div class="quality-form__footer">
        <button type="button" class="secondary-button" id="btnLimparItemRefugo">
          Limpar
        </button>
        <button type="button" class="primary-button" id="btnSalvarItemRefugo">
          Salvar refugo
        </button>
      </div>
    </section>
  </div>

  <script src="/style/qualidade_inspecoes.js"></script>
</body>
</html>
