<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Itens a Contar</title>

    <link rel="stylesheet" href="/style/estoque.css">
</head>

<body class="login-page">

<main class="login-shell">

    <header
        class="login-header"
        style="display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:20px;">

        <a
            href="/qualidade/inspecoes"
            class="primary-button"
            style="text-decoration:none;">
            Voltar
        </a>

        <a class="config" id="config-button" 
        style="display: inline-flex !important; align-items: center !important; justify-content: center !important; width: 36px !important; height: 36px !important; cursor: pointer !important; text-decoration: none !important; margin-right: 20px;">
          <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="currentColor" style="width: 24px !important; height: 24px !important; display: block !important;">
            <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l-.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3-1.07-3-3s1.07-3 3-3s3 1.07 3 3s-1.07 3-3 3z"/>
          </svg>
        </a>

    </header>

    <img
        src="/imagens/logo_agl.png"
        alt="Logo AGL"
        class="logo">

    <section class="login-card">


        <p class="eyebrow">QUALIDADE</p>

        <h1 id="tituloPagina" style="text-align: center;">
            Fila de contagem de refugos
        </h1>

        <div
            style="
                display:flex;
                gap:10px;
                flex-wrap:wrap;
                justify-content:center;
                margin-top:20px;
            ">

            <button
                class="primary-button"
                id="btnAtualizar">
                Atualizar Lista
            </button>

            <button
                class="primary-button"
                id="btnAlternar">
                Mostrar contados hoje
            </button>

        </div>

        <p
            id="statusMessage"
            class="login-status">
        </p>

        <div class="table-container">

            <table class="inventory-table">

                <thead>
                    <tr>
                        <th style="width:120px;">Código</th>
                        <th>Descrição</th>
                        <th style="width:120px;">Qtd</th>
                        <th style="width:180px;">Data/Hora</th>
                    </tr>
                </thead>

                <tbody id="tabelaItens">
                    <!-- JS preenche -->
                </tbody>

            </table>

        </div>

    </section>

</main>

<!-- Modal -->

<div id="modalColeta" class="modal hidden">

    <div class="modal-box">

        <h3 style="margin-bottom:10px;">
            Registrar Contagem
        </h3>

        <div class="modal-info">

            <p><strong>Código:</strong> <span id="c_codigo"></span></p>

            <p><strong>Descrição:</strong> <span id="c_descricao"></span></p>

            <label style="display:block;margin-top:10px;">
                Quantidade

                <input
                    id="c_quantidade"
                    type="number"
                    min="1"
                    inputmode="numeric"
                    style="margin-top:5px;">
            </label>

            <label style="display:block;margin-top:10px;">
                Local

                <select
                    id="c_local"
                    class="tipo"
                    style="margin-top:5px;">

                    <option value="ACIONAMENTO">ACIONAMENTO</option>
                    <option value="ALAVANCA">ALAVANCA</option>
                    
                    <option value="BV">BV</option>
                    <option value="CARCAÇAS">CARCAÇAS</option>
                    <option value="CREMALHEIRAS">CREMALHEIRAS</option>
                    <option value="DZ">DZ</option>
                    <option value="ENGRENAGEM">ENGRENAGEM</option>
                    <option value="FURADEIRAS">FURADEIRAS</option>
                    <option value="KIT">KIT</option>
                    <option value="MANCAL">MANCAL</option>
                    <option value="MESA">MESA</option>
                    <option value="MONTAGEM MOTOR">MONTAGEM MOTOR</option>
                    <option value="NEW BV">NEW BV</option>
                    <option value="PLACAS">PLACAS</option>
                    <option value="PV">PV</option>




                </select>
            </label>

        </div>

        <div class="modal-actions">

            <button id="btnSalvarColeta" class="primary-button">
                Registrar
            </button>

            <button id="btnFecharColeta" class="primary-button" style="background:#6b7280;">
                Cancelar
            </button>

        </div>

    </div>

</div>

<script src="/style/refugo_qualidade.js"></script>

<footer class=""><a href="https://github.com/oneto133/etiquetas/blob/master/CHANGELOG.md">Versão 1.7.0</a></footer>

<div id="configSidebar" class="sidebar-panel">

  <div class="sidebar-header">
    <h2>Configurações</h2>
    <button id="fecharSidebar" class="sidebar-fechar">&times;</button>
  </div>

  <div class="sidebar-conteudo">

    <div class="secao-retratil">
      <p class="titulo-gatilho">
        Base de Itens
        <span class="seta-icone">▼</span>
      </p>

      <div class="conteudo-gatilho">

        <div class="config-grupo">

            

          <div class="config-sub-opcoes">
            <button class="btn-acao btn-download" id="btnDownloadHistorico">
                Baixar Histórico
            </button>

            <button class="btn-acao btn-download" id="btnDownloadBase">
              Baixar Base
            </button>

            <label class="btn-acao btn-upload" style="text-align:center;">
              Upload Base
              <input type="file" id="inputUploadBase" hidden>
            </label>

          </div>

        </div>

      </div>
    </div>

  </div>
</div>

</body>
</html>
