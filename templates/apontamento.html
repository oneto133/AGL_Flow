<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Apontar ordem de produção</title>
    <link rel="stylesheet" href="/style/trello.css">
    <link rel="stylesheet" href="/style/apontamento.css">
    <link rel="stylesheet" href="/style/qualidade_inspecao_op.css">
    <link rel="stylesheet" href="/style/qualidade_inspecao_op.css">

  </head>
  <body class="login-page">
    <main class="login-shell">
      <header class="login-header" style="display: flex !important; justify-content: space-between !important; align-items: center !important; width: 100% !important; margin-bottom: 20px;">

        <a href="/tela_inicial" class="primary-button" id="back-button" style="text-decoration: none;">
          Voltar
        </a>
        <a class="config" id="config-button" 
        style="display: inline-flex !important; align-items: center !important; justify-content: center !important; width: 36px !important; height: 36px !important; cursor: pointer !important; text-decoration: none !important; margin-right: 20px;">
          <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="currentColor" style="width: 24px !important; height: 24px !important; display: block !important;">
            <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l-.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3-1.07-3-3s1.07-3 3-3s3 1.07 3 3s-1.07 3-3 3z"/>
          </svg>
        </a>
      </header>

      <img src="/imagens/logo_agl.png" alt="Logo AGL" class="logo">
      
      <section class="login-card">
        <p class="eyebrow">Apontamento de OP</p>
        <h1>Registre</h1>
        
        <form id="trelloForm" class="login-form">
          <label>
            <span>Seção</span>
            <select id="secaoSelecao" name="secao" required class="tipo centralizar-texto">
              <option value="" disabled selected>Selecione uma seção</option>
            </select>
          </label>

          <label>
            <span>Linha</span>
            <select name="linha" id="linhaSelecao" required class="autocomplete-container tipo centralizar-texto">
              <option value="" disabled selected>Selecione uma linha</option>
            </select>
          </label>

          <label>
            <span>Selecione número da OP</span>
            <select name="selecaoOP" id="selecaoOP" required class="tipo centralizar-texto">
              <option value="" disabled selected>Selecione uma OP</option>
            </select>
          </label>

          <section id="painelResumo" class="login-card qualidade-hero" style="display: none;">
            <div><strong>OP:</strong> <span id="infoOP">-</span></div>
            <div><strong>Código:</strong> <span id="infoCodigo">-</span></div>
            <div><strong>Descrição:</strong> <span id="infoDescricao">-</span></div>
            <div><strong>Quantidade programada:</strong> <span id="infoQtdProgramada">-</span></div>
            <div><strong>Quantidade apontada:</strong> <span id="infoQtdApontada">-</span></div>
            <div><strong>Último apontamento:</strong> <span id="infoUltimoApontamento">-</span></div>
            <div><strong>Data/Hora último apontamento:</strong> <span id="infoDataHora">-</span></div>
          </section>

          <label>
            <span>Quantidade</span>
            <input id="manualQuantity" name="quantidade" type="text" inputmode="numeric" pattern="[0-9]*" min="1" max="500" value="1" required class="tipo centralizar-texto">
          </label>

          <label>
            <span>Status</span>
            <select name="statusOP" id="statusOP" class="tipo centralizar-texto">
              <option value="" disabled selected>Selecione um status</option>
              <option value="Em processo">Em Processo</option>
              <option value="Pausado">Pausado</option>
              <option value="Pausado">Finalizado</option>
              <option value="Aguardando Qualidade">Aguardando Qualidade</option>
              <option value="Café">Café</option>
              <option value="Almoço">Almoço</option>
            </select>
          </label>

          <label for="">
            <span>Observação</span>
            <textarea name="observação" id="observacao" title="Digite aqui a observação" rows="5" class="tipo" placeholder="Digite a observação da linha se houver" style="cursor: text !important;"></textarea>
          </label>

          <div class="container-enviar-trello">
            <button class="primary-button" type="submit" style="width: 100%; height: auto;">Registrar Apontamento</button>
          </div>
        </form>

        <p id="statusMessage" class="login-status" role="status"></p>
      </section>
    </main>
        <footer class=""><a href="https://github.com/oneto133/etiquetas/blob/master/CHANGELOG.md">Versão 1.7.0</a></footer>
    <a class="apontamento-manual-fab" href="/apontamento/manual" aria-label="Novo apontamento manual">+</a>
    <script src="/style/apontamento.js"></script>
    
  </body>
</html>
